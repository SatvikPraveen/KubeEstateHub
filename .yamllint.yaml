extends: default

ignore: |
  helm-charts/kubeestatehub/templates/
  .venv/
  bin/

rules:
  line-length: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: consistent
    indent-sequences: whatever
  braces:
    max-spaces-inside: 1
