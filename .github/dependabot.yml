version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - "/"
      - "/src/analytics-worker"
      - "/src/listings-api"
      - "/src/metrics-service"
      - "/src/realestate-sync-operator"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/src/analytics-worker"
      - "/src/frontend-dashboard"
      - "/src/listings-api"
      - "/src/metrics-service"
      - "/src/realestate-sync-operator"
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # The stack targets PostgreSQL 16 (manifests, chart, CI integration job); a major
      # upgrade needs a data migration and is done deliberately across all of them.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
