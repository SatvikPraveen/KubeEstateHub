version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directories: [/, /src/listings-api, /src/analytics-worker, /src/metrics-service, /src/realestate-sync-operator]
    schedule: {interval: weekly}
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/src/listings-api, /src/analytics-worker, /src/metrics-service, /src/frontend-dashboard, /src/realestate-sync-operator]
    schedule: {interval: weekly}
