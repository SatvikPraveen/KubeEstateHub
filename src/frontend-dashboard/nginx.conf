# nginx for the dashboard. Runs as UID 101 with a read-only root filesystem: every
# writable path lives under /tmp (an emptyDir in Kubernetes).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"duration":$request_time,"request_id":"$request_id","ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API is reached same-origin through this proxy (docker compose) or directly via
  # the Ingress (Kubernetes routes /api, /openapi.json and /readyz to listings-api).
  upstream listings_api { server listings-api:8080; keepalive 16; }

  # Cache policy is chosen here, not with add_header inside locations: any add_header in
  # a location silently discards all server-level add_header directives (security headers).
  map $uri $cache_control {
    ~^/(api/|openapi\.json$|readyz$) "";
    ~*\.(css|js)$                     "public, max-age=300";
    default                            "no-cache";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location ~ ^/(api/|openapi\.json$|readyz$) {
      proxy_pass http://listings_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location / { try_files $uri /index.html; }
  }
}
