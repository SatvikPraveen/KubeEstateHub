# Credentials are synced from the organisation's secret manager by External Secrets
# Operator (https://external-secrets.io); nothing sensitive is committed. The
# ClusterSecretStore "kubeestatehub" is provisioned with the platform (see platform/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: kubeestatehub}
  target:
    name: db-secret
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        database-url: "postgresql://{{ .username }}:{{ .password }}@postgres:5432/kubeestatehub"
  data:
    - {secretKey: username, remoteRef: {key: kubeestatehub/production/postgres, property: username}}
    - {secretKey: password, remoteRef: {key: kubeestatehub/production/postgres, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secret
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: kubeestatehub}
  target: {name: api-secret}
  data:
    - {secretKey: write-token, remoteRef: {key: kubeestatehub/production/api, property: write-token}}
