apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeestatehub

resources:
  - ../../../manifests/base
  - external-secrets.yaml
components:
  - ../../../manifests/components/monitoring
  - ../../../manifests/components/operator
  - ../../../manifests/components/admission-policy
  - ../../../manifests/components/backup

labels:
  - pairs: {app.kubernetes.io/environment: production}
    includeSelectors: false

images:
  - {name: ghcr.io/satvikpraveen/kubeestatehub/listings-api, newTag: "2.0.0"}
  - {name: ghcr.io/satvikpraveen/kubeestatehub/frontend-dashboard, newTag: "2.0.0"}
  - {name: ghcr.io/satvikpraveen/kubeestatehub/metrics-service, newTag: "2.0.0"}
  - {name: ghcr.io/satvikpraveen/kubeestatehub/analytics-worker, newTag: "2.0.0"}
  - {name: ghcr.io/satvikpraveen/kubeestatehub/realestate-sync-operator, newTag: "2.0.0"}

configMapGenerator:
  - name: listings-api-config
    behavior: merge
    literals: [ENVIRONMENT=production, LOG_LEVEL=INFO, GUNICORN_WORKERS=3]

patches:
  - target: {kind: HorizontalPodAutoscaler, name: listings-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 3}
      - {op: replace, path: /spec/maxReplicas, value: 20}
  - target: {kind: Deployment, name: listings-api}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 3}
      - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "2", memory: 512Mi}}}
  - target: {kind: PodDisruptionBudget, name: listings-api}
    patch: |-
      - {op: replace, path: /spec/minAvailable, value: 2}
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 100Gi}
      - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "4", memory: 4Gi}}}
  - target: {kind: Ingress, name: kubeestatehub}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: kubeestatehub.example.com}
      - {op: add, path: /spec/tls, value: [{hosts: [kubeestatehub.example.com], secretName: kubeestatehub-tls}]}
      - {op: add, path: /metadata/annotations/cert-manager.io~1cluster-issuer, value: letsencrypt-prod}
      - {op: add, path: /metadata/annotations/nginx.ingress.kubernetes.io~1force-ssl-redirect, value: "true"}
