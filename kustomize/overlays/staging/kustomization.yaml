apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeestatehub

resources:
  - ../../../manifests/base
  - external-secrets.yaml
components:
  - ../../../manifests/components/monitoring
  - ../../../manifests/components/operator
  - ../../../manifests/components/admission-policy
  - ../../../manifests/components/backup

labels:
  - pairs: {app.kubernetes.io/environment: staging}
    includeSelectors: false

images:
  - {name: ghcr.io/satvikpraveen/kubeestatehub/listings-api, newTag: "2.0.0"}
  - {name: ghcr.io/satvikpraveen/kubeestatehub/frontend-dashboard, newTag: "2.0.0"}
  - {name: ghcr.io/satvikpraveen/kubeestatehub/metrics-service, newTag: "2.0.0"}
  - {name: ghcr.io/satvikpraveen/kubeestatehub/analytics-worker, newTag: "2.0.0"}
  - {name: ghcr.io/satvikpraveen/kubeestatehub/realestate-sync-operator, newTag: "2.0.0"}

configMapGenerator:
  - name: listings-api-config
    behavior: merge
    literals: [ENVIRONMENT=staging]

patches:
  - target: {kind: Ingress, name: kubeestatehub}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: staging.kubeestatehub.example.com}
  - target: {kind: ValidatingAdmissionPolicyBinding}
    patch: |-
      - {op: replace, path: /spec/validationActions, value: [Warn, Audit]}
