# One identity per workload. None of them talk to the Kubernetes API, so tokens are
# not mounted (the operator component defines its own account with RBAC).
apiVersion: v1
kind: ServiceAccount
metadata: {name: listings-api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: metrics-service}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: analytics}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis}
automountServiceAccountToken: false
