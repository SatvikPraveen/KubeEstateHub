# Applies db/migrations (mounted from the generated db-migrations ConfigMap). The runner is
# idempotent and checksum-verified; ttlSecondsAfterFinished lets a later `kubectl apply`
# recreate the (immutable) Job for the next release. The listings API stays unready until
# the schema version it requires is present, so ordering is enforced without init hacks.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels: {app.kubernetes.io/name: db-migrate, app.kubernetes.io/component: database}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: db-migrate, app.kubernetes.io/component: database}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: postgres:16.4-alpine
          command: [sh, /db/migrations/migrate.sh, /db/migrations]
          env:
            - {name: PGHOST, value: postgres}
            - {name: PGDATABASE, value: kubeestatehub}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: db-secret, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: migrations, mountPath: /db/migrations, readOnly: true}]
      volumes:
        - name: migrations
          configMap: {name: db-migrations}
