# Single-primary PostgreSQL 16 for the application. Production deployments should prefer
# a managed service or an operator (CloudNativePG); see docs/operations/database.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/component: database}
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/component: database}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              value: kubeestatehub
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: db-secret, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256 --data-checksums
          args: ["-c", "shared_buffers=256MB", "-c", "max_connections=200", "-c", "log_min_duration_statement=500",
                 "-c", "track_io_timing=on", "-c", "password_encryption=scram-sha-256"]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1]}
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports: [{name: metrics, containerPort: 9187}]
          env:
            - name: DATA_SOURCE_URI
              value: 127.0.0.1:5432/kubeestatehub?sslmode=disable
            - name: DATA_SOURCE_USER
              valueFrom: {secretKeyRef: {name: db-secret, key: username}}
            - name: DATA_SOURCE_PASS
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: metrics}
          livenessProbe:
            httpGet: {path: /, port: metrics}
            periodSeconds: 30
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/component: database}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
    - {name: metrics, port: 9187, targetPort: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/component: database}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
