  0001_core_schema.sql: |
    -- 0001: core listings schema.
    -- Conventions: timestamps are timestamptz (UTC), money is NUMERIC, enums are created
    -- idempotently (PostgreSQL has no CREATE TYPE IF NOT EXISTS).

    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    DO $$ BEGIN
        CREATE TYPE property_type AS ENUM ('residential', 'commercial', 'industrial', 'land', 'multi_family');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    DO $$ BEGIN
        CREATE TYPE listing_status AS ENUM ('active', 'pending', 'sold', 'withdrawn', 'expired', 'deleted');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    CREATE TABLE IF NOT EXISTS listings (
        id              BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        mls_number      VARCHAR(50)    NOT NULL UNIQUE,
        title           VARCHAR(255)   NOT NULL,
        description     TEXT,
        property_type   property_type  NOT NULL,
        status          listing_status NOT NULL DEFAULT 'active',
        price           NUMERIC(14, 2) NOT NULL CHECK (price > 0),          -- list price
        sale_price      NUMERIC(14, 2)          CHECK (sale_price > 0),     -- closing price
        bedrooms        SMALLINT                CHECK (bedrooms >= 0),
        bathrooms       NUMERIC(3, 1)           CHECK (bathrooms >= 0),
        square_feet     INTEGER                 CHECK (square_feet > 0),
        lot_size_sqft   INTEGER                 CHECK (lot_size_sqft > 0),
        year_built      SMALLINT                CHECK (year_built BETWEEN 1800 AND 2100),
        address         VARCHAR(255)   NOT NULL,
        city            VARCHAR(100)   NOT NULL,
        state           CHAR(2)        NOT NULL,
        zip_code        VARCHAR(10)    NOT NULL,
        latitude        NUMERIC(9, 6)           CHECK (latitude BETWEEN -90 AND 90),
        longitude       NUMERIC(9, 6)           CHECK (longitude BETWEEN -180 AND 180),
        listing_date    DATE           NOT NULL DEFAULT CURRENT_DATE,
        sold_date       DATE,
        agent_name      VARCHAR(100),
        agent_email     VARCHAR(255),
        agent_phone     VARCHAR(30),
        image_url       VARCHAR(500),
        thumbnail_url   VARCHAR(500),
        price_per_sqft  NUMERIC(12, 2) GENERATED ALWAYS AS (
                            CASE WHEN square_feet > 0 THEN round(price / square_feet, 2) END
                        ) STORED,
        created_at      TIMESTAMPTZ    NOT NULL DEFAULT now(),
        updated_at      TIMESTAMPTZ    NOT NULL DEFAULT now(),
        CONSTRAINT sold_requires_outcome
            CHECK (status <> 'sold' OR (sold_date IS NOT NULL AND sale_price IS NOT NULL)),
        CONSTRAINT sold_after_listed
            CHECK (sold_date IS NULL OR sold_date >= listing_date)
    );

    CREATE INDEX IF NOT EXISTS idx_listings_status_city   ON listings (status, city);
    CREATE INDEX IF NOT EXISTS idx_listings_type          ON listings (property_type);
    CREATE INDEX IF NOT EXISTS idx_listings_price         ON listings (price);
    CREATE INDEX IF NOT EXISTS idx_listings_listing_date  ON listings (listing_date DESC, id DESC);
    CREATE INDEX IF NOT EXISTS idx_listings_sold_date     ON listings (city, sold_date) WHERE status = 'sold';
    CREATE INDEX IF NOT EXISTS idx_listings_title_trgm    ON listings USING gin (title gin_trgm_ops);

    CREATE OR REPLACE FUNCTION touch_updated_at() RETURNS trigger
    LANGUAGE plpgsql AS $$
    BEGIN
        NEW.updated_at := now();
        RETURN NEW;
    END;
    $$;

    DROP TRIGGER IF EXISTS listings_touch_updated_at ON listings;
    CREATE TRIGGER listings_touch_updated_at
        BEFORE UPDATE ON listings
        FOR EACH ROW EXECUTE FUNCTION touch_updated_at();
  0002_analytics_schema.sql: |
    -- 0002: analytics outputs with provenance.
    -- Every derived row references the model_runs row that produced it, so any number
    -- shown on a dashboard can be traced to code version, seed, parameters and metrics.

    CREATE TABLE IF NOT EXISTS model_runs (
        id              UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        pipeline        VARCHAR(64) NOT NULL,
        code_version    VARCHAR(64) NOT NULL,
        random_seed     BIGINT      NOT NULL,
        status          VARCHAR(16) NOT NULL DEFAULT 'running'
                        CHECK (status IN ('running', 'succeeded', 'failed')),
        n_observations  INTEGER,
        parameters      JSONB       NOT NULL DEFAULT '{}'::jsonb,
        metrics         JSONB       NOT NULL DEFAULT '{}'::jsonb,
        error           TEXT,
        started_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        finished_at     TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_model_runs_pipeline_started ON model_runs (pipeline, started_at DESC);

    CREATE TABLE IF NOT EXISTS market_trends (
        id                        BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        model_run_id              UUID          NOT NULL REFERENCES model_runs (id) ON DELETE CASCADE,
        city                      VARCHAR(100)  NOT NULL,
        state                     CHAR(2)       NOT NULL,
        property_type             property_type,             -- NULL = all types
        period_start              DATE          NOT NULL,
        period_end                DATE          NOT NULL,
        n_sales                   INTEGER       NOT NULL,
        n_active                  INTEGER       NOT NULL,
        median_sale_price         NUMERIC(14, 2),
        median_sale_price_ci_low  NUMERIC(14, 2),
        median_sale_price_ci_high NUMERIC(14, 2),
        median_price_per_sqft     NUMERIC(12, 2),
        median_days_on_market     NUMERIC(8, 2),
        sale_to_list_ratio        NUMERIC(6, 4),
        months_of_supply          NUMERIC(8, 2),
        absorption_rate           NUMERIC(6, 4),
        trend_slope_pct_per_month NUMERIC(8, 4),             -- Theil-Sen slope of log median price/sqft
        trend_slope_ci_low        NUMERIC(8, 4),
        trend_slope_ci_high       NUMERIC(8, 4),
        mann_kendall_tau          NUMERIC(6, 4),
        mann_kendall_p            NUMERIC(8, 6),
        trend_direction           VARCHAR(20)   NOT NULL,
        computed_at               TIMESTAMPTZ   NOT NULL DEFAULT now(),
        CONSTRAINT market_trends_period CHECK (period_end >= period_start),
        CONSTRAINT market_trends_unique UNIQUE NULLS NOT DISTINCT
            (city, state, property_type, period_start, period_end)
    );
    CREATE INDEX IF NOT EXISTS idx_market_trends_city ON market_trends (city, period_end DESC);

    CREATE TABLE IF NOT EXISTS price_index (
        model_run_id UUID          NOT NULL REFERENCES model_runs (id) ON DELETE CASCADE,
        period       DATE          NOT NULL,                  -- first day of month
        index_value  NUMERIC(10, 4) NOT NULL,                 -- base period = 100
        std_error    NUMERIC(10, 6),
        n_sales      INTEGER       NOT NULL,
        PRIMARY KEY (model_run_id, period)
    );

    CREATE TABLE IF NOT EXISTS property_valuations (
        id               BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        listing_id       BIGINT        NOT NULL REFERENCES listings (id) ON DELETE CASCADE,
        model_run_id     UUID          NOT NULL REFERENCES model_runs (id) ON DELETE CASCADE,
        method           VARCHAR(32)   NOT NULL,
        estimated_value  NUMERIC(14, 2) NOT NULL CHECK (estimated_value > 0),
        interval_low     NUMERIC(14, 2),
        interval_high    NUMERIC(14, 2),
        confidence_level NUMERIC(4, 3) CHECK (confidence_level > 0 AND confidence_level < 1),
        created_at       TIMESTAMPTZ   NOT NULL DEFAULT now(),
        CONSTRAINT property_valuations_interval CHECK (interval_low IS NULL OR interval_low <= interval_high),
        CONSTRAINT property_valuations_unique UNIQUE (listing_id, model_run_id, method)
    );
    CREATE INDEX IF NOT EXISTS idx_property_valuations_listing ON property_valuations (listing_id, created_at DESC);
  migrate.sh: |
    #!/bin/sh
    # Apply versioned SQL migrations in lexical order, exactly once each.
    #
    # * Each migration runs in a single transaction together with its bookkeeping row.
    # * A SHA-256 checksum is recorded; editing an already-applied migration is a hard
    #   error, so every environment provably runs the same DDL.
    # * POSIX sh only: runs in postgres:*-alpine (busybox) as well as in CI.
    #
    # Connection settings come from the standard libpq variables (PGHOST, PGUSER, ...).
    # Usage: migrate.sh [migrations-dir]
    set -eu

    DIR="${1:-$(dirname "$0")/migrations}"
    WAIT_SECONDS="${MIGRATE_WAIT_SECONDS:-120}"
    export PGOPTIONS="${PGOPTIONS:-} -c client_min_messages=warning"

    i=0
    until pg_isready -q; do
      i=$((i + 1))
      if [ "$i" -ge "$WAIT_SECONDS" ]; then
        echo "migrate: database not ready after ${WAIT_SECONDS}s" >&2
        exit 1
      fi
      sleep 1
    done

    psql -v ON_ERROR_STOP=1 -qX -c "CREATE TABLE IF NOT EXISTS schema_migrations (
        version    TEXT PRIMARY KEY,
        checksum   TEXT NOT NULL,
        applied_at TIMESTAMPTZ NOT NULL DEFAULT now())"

    applied=0
    for file in "$DIR"/*.sql; do  # glob expansion is already lexically sorted
      version="$(basename "$file" .sql)"
      sum="$(sha256sum "$file" | cut -d' ' -f1)"
      recorded="$(psql -qXAt -v ON_ERROR_STOP=1 -v v="$version" <<SQL
    SELECT checksum FROM schema_migrations WHERE version = :'v';
    SQL
    )"
      if [ -n "$recorded" ]; then
        if [ "$recorded" != "$sum" ]; then
          echo "migrate: checksum mismatch for $version (applied $recorded, file $sum)" >&2
          exit 2
        fi
        continue
      fi
      echo "migrate: applying $version"
      psql -qX -v ON_ERROR_STOP=1 --single-transaction -v v="$version" -v s="$sum" <<SQL
    \i $file
    INSERT INTO schema_migrations (version, checksum) VALUES (:'v', :'s');
    SQL
      applied=$((applied + 1))
    done

    echo "migrate: done ($applied applied)"
