apiVersion: apps/v1
kind: Deployment
metadata:
  name: listings-api
  labels: {app.kubernetes.io/name: listings-api, app.kubernetes.io/component: api}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: listings-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: listings-api, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: listings-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: listings-api}}
      containers:
        - name: api
          image: ghcr.io/satvikpraveen/kubeestatehub/listings-api:2.0.0
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: listings-api-config}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db-secret, key: database-url}}
            - name: API_WRITE_TOKEN
              valueFrom: {secretKeyRef: {name: api-secret, key: write-token}}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # let endpoints/ingress deregister the pod before gunicorn stops accepting
            preStop: {sleep: {seconds: 5}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: listings-api
  labels: {app.kubernetes.io/name: listings-api, app.kubernetes.io/component: api}
spec:
  selector: {app.kubernetes.io/name: listings-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: listings-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: listings-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 50, periodSeconds: 60}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: listings-api
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow   # never let crash-looping pods block node drains
  selector:
    matchLabels: {app.kubernetes.io/name: listings-api}
