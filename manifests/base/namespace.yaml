apiVersion: v1
kind: Namespace
metadata:
  name: kubeestatehub
  labels:
    # Pod Security Admission: every workload must satisfy the "restricted" profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kubeestatehub-quota
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    requests.storage: 500Gi
    pods: "60"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kubeestatehub-defaults
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {memory: 256Mi}
      max: {memory: 4Gi}
