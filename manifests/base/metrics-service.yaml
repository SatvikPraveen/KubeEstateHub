apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  labels: {app.kubernetes.io/name: metrics-service, app.kubernetes.io/component: exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: metrics-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: metrics-service, app.kubernetes.io/component: exporter}
    spec:
      serviceAccountName: metrics-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: exporter
          image: ghcr.io/satvikpraveen/kubeestatehub/metrics-service:2.0.0
          ports: [{name: metrics, containerPort: 8080}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db-secret, key: database-url}}
            - {name: CACHE_TTL_SECONDS, value: "30"}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            periodSeconds: 30
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  labels: {app.kubernetes.io/name: metrics-service, app.kubernetes.io/component: exporter}
spec:
  selector: {app.kubernetes.io/name: metrics-service}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
