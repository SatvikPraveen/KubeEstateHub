apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The application. Secrets db-secret (username, password, database-url) and api-secret
# (write-token) are supplied by each overlay; see kustomize/README.md.
namespace: kubeestatehub

labels:
  - pairs:
      app.kubernetes.io/part-of: kubeestatehub
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - config.yaml
  - db-migrations-configmap.yaml   # generated by hack/generate.py from db/
  - postgres.yaml
  - redis.yaml
  - db-migrate-job.yaml
  - listings-api.yaml
  - frontend.yaml
  - metrics-service.yaml
  - analytics-pipeline.yaml
  - ingress.yaml
  - network-policies.yaml
