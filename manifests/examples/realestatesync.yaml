# Example RealEstateSync resources. The operator turns each into a CronJob running
# `python -m analytics_worker sync ...` with the analytics-worker image.
apiVersion: realestate.kubeestatehub.io/v1
kind: RealEstateSync
metadata:
  name: partner-feed-daily
  namespace: kubeestatehub
spec:
  source:
    type: csv
    endpoint: https://feeds.example.com/listings/daily.csv
    credentials:
      secretRef:
        name: partner-feed-credentials
        key: token
  schedule: "0 2 * * *"
  syncConfig:
    batchSize: 500
    retryLimit: 3
    maxFailedRecords: 25
    timeout: 45m
    filters:
      propertyTypes: [residential, multi_family]
      priceRange: {min: 50000, max: 5000000}
      location: {state: TX}
---
apiVersion: realestate.kubeestatehub.io/v1
kind: RealEstateSync
metadata:
  name: brokerage-api-hourly
  namespace: kubeestatehub
spec:
  source:
    type: api
    endpoint: https://api.example-brokerage.com/v1/listings?updated_since=1h
  schedule: "@hourly"
  suspend: true
  syncConfig:
    timeout: 10m
