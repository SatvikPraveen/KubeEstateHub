environment: production
externalSecrets:
  enabled: true
  postgresKey: kubeestatehub/production/postgres
  apiKey: kubeestatehub/production/api
listingsApi:
  replicas: 3
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 512Mi}
  autoscaling: {minReplicas: 3, maxReplicas: 20}
  pdb: {minAvailable: 2}
  config: {GUNICORN_WORKERS: "3"}
postgres:
  storage: 100Gi
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {memory: 4Gi}
ingress:
  host: kubeestatehub.example.com
  tls: {enabled: true, clusterIssuer: letsencrypt-prod}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
monitoring:
  enabled: true
backup:
  enabled: true
