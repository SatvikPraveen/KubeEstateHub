      message: containers must set securityContext.readOnlyRootFilesystem=true
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: containers must declare a memory limit
    - expression: >-
        object.spec.containers.all(c, has(c.resources) && has(c.resources.requests) && 'cpu' in c.resources.requests)
      message: containers must declare a CPU request (required for HPA and scheduling)
