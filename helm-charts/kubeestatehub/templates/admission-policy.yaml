# Pod Security Admission ("restricted", set on the namespace) already blocks privileged
# pods; this policy adds platform conventions PSA cannot express.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubeestatehub-workload-standards
spec:
