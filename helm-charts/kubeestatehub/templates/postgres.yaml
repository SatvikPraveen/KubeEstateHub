apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "keh.labels" (dict "ctx" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {{- include "keh.podLabels" (dict "name" "postgres" "component" "database") | nindent 8 }}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "keh.podSecurityContext" (dict "uid" 70 "fsGroup" true) | nindent 8 }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: kubeestatehub}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: db-secret, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_INITDB_ARGS, value: --auth-host=scram-sha-256 --data-checksums}
          args: ["-c", "shared_buffers=256MB", "-c", "max_connections=200", "-c", "log_min_duration_statement=500",
                 "-c", "track_io_timing=on", "-c", "password_encryption=scram-sha-256"]
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "keh.containerSecurityContext" . | nindent 12 }}
          startupProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1]}
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
        - name: exporter
          image: {{ .Values.postgres.exporterImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{name: metrics, containerPort: 9187}]
          env:
            - {name: DATA_SOURCE_URI, value: "127.0.0.1:5432/kubeestatehub?sslmode=disable"}
            - name: DATA_SOURCE_USER
              valueFrom: {secretKeyRef: {name: db-secret, key: username}}
            - name: DATA_SOURCE_PASS
              valueFrom: {secretKeyRef: {name: db-secret, key: password}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            {{- include "keh.containerSecurityContext" . | nindent 12 }}
            runAsUser: 65534
            runAsGroup: 65534
          readinessProbe:
            httpGet: {path: /, port: metrics}
          livenessProbe:
            httpGet: {path: /, port: metrics}
            periodSeconds: 30
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "keh.labels" (dict "ctx" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
    - {name: metrics, port: 9187, targetPort: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels: {{- include "keh.labels" (dict "ctx" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
