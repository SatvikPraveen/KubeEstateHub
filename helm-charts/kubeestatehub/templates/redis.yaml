apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "keh.labels" (dict "ctx" . "name" "redis" "component" "cache") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {{- include "keh.podLabels" (dict "name" "redis" "component" "cache") | nindent 8 }}
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext: {{- include "keh.podSecurityContext" (dict "uid" 10999) | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru",
                 "--protected-mode", "no"]
          ports: [{name: redis, containerPort: 6379}]
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext: {{- include "keh.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 20
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "keh.labels" (dict "ctx" . "name" "redis" "component" "cache") | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
