apiVersion: v1
kind: Pod
metadata:
  name: kubeestatehub-test-api
  labels: {{- include "keh.podLabels" (dict "name" "helm-test" "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {{- include "keh.podSecurityContext" (dict "uid" 10001) | nindent 4 }}
  containers:
    - name: check
      image: {{ include "keh.image" (dict "ctx" . "name" "listings-api") }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          for url in ("http://listings-api:8080/readyz", "http://listings-api:8080/api/v1/listings?per_page=1",
                      "http://frontend:8080/healthz"):
              with urllib.request.urlopen(url, timeout=10) as r:
                  assert r.status == 200, url
          print("ok")
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}
      securityContext: {{- include "keh.containerSecurityContext" . | nindent 8 }}
