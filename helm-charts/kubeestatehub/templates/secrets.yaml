{{- if .Values.secrets.create }}
{{- $user := .Values.secrets.dbUsername }}
{{- $pass := .Values.secrets.dbPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels: {{- include "keh.labels" (dict "ctx" . "name" "postgres") | nindent 4 }}
type: Opaque
stringData:
  username: {{ $user | quote }}
  password: {{ $pass | quote }}
  database-url: {{ printf "postgresql://%s:%s@postgres:5432/kubeestatehub" (urlquery $user) (urlquery $pass) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  labels: {{- include "keh.labels" (dict "ctx" . "name" "listings-api") | nindent 4 }}
type: Opaque
stringData:
  write-token: {{ .Values.secrets.writeToken | quote }}
{{- end }}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  labels: {{- include "keh.labels" (dict "ctx" . "name" "postgres") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {kind: {{ $es.storeKind }}, name: {{ $es.storeName }}}
  target:
    name: db-secret
    template:
      data:
        username: "{{`{{ .username }}`}}"
        password: "{{`{{ .password }}`}}"
        database-url: "postgresql://{{`{{ .username }}`}}:{{`{{ .password }}`}}@postgres:5432/kubeestatehub"
  data:
    - {secretKey: username, remoteRef: {key: {{ $es.postgresKey }}, property: username}}
    - {secretKey: password, remoteRef: {key: {{ $es.postgresKey }}, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secret
  labels: {{- include "keh.labels" (dict "ctx" . "name" "listings-api") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {kind: {{ $es.storeKind }}, name: {{ $es.storeName }}}
  target: {name: api-secret}
  data:
    - {secretKey: write-token, remoteRef: {key: {{ $es.apiKey }}, property: write-token}}
{{- end }}
