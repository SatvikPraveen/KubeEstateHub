# Workspace-level tooling configuration for KubeEstateHub.
# Each service under src/ ships its own pinned requirements.txt and container image;
# this file only configures shared developer tooling (ruff, pytest, coverage, mypy).

[project]
name = "kubeestatehub"
version = "2.0.0"
description = "Cloud-native real estate analytics platform on Kubernetes: services, operator, and reproducible market analytics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Satvik Praveen", email = "satvikpraveen707@gmail.com" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/integration-tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "S", "RUF", "PT", "N"]
ignore = [
  "S104", # binding to 0.0.0.0 is intended inside containers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "N802"]
"scripts/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["listings_api", "analytics_worker", "metrics_service", "realestate_sync_operator"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = [
  "src/listings-api",
  "src/analytics-worker",
  "src/metrics-service",
  "src/realestate-sync-operator",
]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires a live PostgreSQL (set DATABASE_URL)",
  "slow: statistically heavy tests (Monte Carlo)",
]
filterwarnings = ["error::DeprecationWarning:listings_api.*", "error::DeprecationWarning:analytics_worker.*"]

[tool.coverage.run]
branch = true
source = [
  "src/listings-api/listings_api",
  "src/analytics-worker/analytics_worker",
  "src/metrics-service/metrics_service",
  "src/realestate-sync-operator/realestate_sync_operator",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
