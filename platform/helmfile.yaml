# Cluster prerequisites, pinned. `helmfile sync` installs them into a fresh cluster.
# KubeEstateHub itself does not vendor these components; it integrates with them.
repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.11.3
    values:
      - controller:
          metrics: {enabled: true, serviceMonitor: {enabled: true}}
          config: {enable-real-ip: "true", use-forwarded-headers: "false"}

  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 65.5.0
    values:
      - values/kube-prometheus-stack.yaml

  - name: prometheus-pushgateway
    namespace: monitoring
    chart: prometheus-community/prometheus-pushgateway
    version: 2.15.0
    values:
      - serviceMonitor: {enabled: true}

  - name: metrics-server           # required by the HorizontalPodAutoscalers
    namespace: kube-system
    chart: metrics-server/metrics-server
    version: 3.12.2

  - name: external-secrets         # staging/production credentials (ExternalSecret)
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 0.17.0

  - name: cert-manager             # TLS for the production Ingress
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.16.1
    values:
      - crds: {enabled: true}
